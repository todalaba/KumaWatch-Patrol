<svg viewBox="0 0 760 250" width="1520" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK JP, Noto Sans, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44505c"/></marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#44505c;stroke-width:1.2}
    .aibox{fill:#fbeee6;stroke:#b3541e;stroke-width:1.6}
    .sim{fill:#eef4f8;stroke:#1f5f8b;stroke-width:1.2}
    .t{font-size:12.5px;fill:#1d232a;font-weight:700}
    .s{font-size:10.5px;fill:#5b6570}
    .l{font-size:10px;fill:#44505c}
    .e{stroke:#44505c;stroke-width:1.3;fill:none;marker-end:url(#a)}
  </style>
  <!-- AI1 -->
  <rect class="aibox" x="10" y="20" width="160" height="58" rx="6"/>
  <text class="t" x="90" y="43" text-anchor="middle">AI 1: TTM forecast</text>
  <text class="s" x="90" y="61" text-anchor="middle">KumaWatch, 144 cells</text>
  <rect class="box" x="210" y="20" width="150" height="58" rx="6"/>
  <text class="t" x="285" y="43" text-anchor="middle">risk_predictor</text>
  <text class="s" x="285" y="61" text-anchor="middle">publishes risk of 5 sites</text>
  <rect class="box" x="400" y="20" width="170" height="58" rx="6"/>
  <text class="t" x="485" y="43" text-anchor="middle">mission_planner</text>
  <text class="s" x="485" y="61" text-anchor="middle">site choice, order, state machine</text>
  <rect class="box" x="610" y="20" width="140" height="58" rx="6"/>
  <text class="t" x="680" y="43" text-anchor="middle">Navigation2</text>
  <text class="s" x="680" y="61" text-anchor="middle">AMCL, NavFn, DWB</text>
  <!-- robot -->
  <rect class="sim" x="580" y="150" width="170" height="70" rx="6"/>
  <text class="t" x="665" y="176" text-anchor="middle">TurtleBot3 (Gazebo)</text>
  <text class="s" x="665" y="195" text-anchor="middle">camera, LiDAR, odometry</text>
  <text class="s" x="665" y="210" text-anchor="middle">forest-edge town world</text>
  <!-- AI2 -->
  <rect class="aibox" x="330" y="150" width="190" height="70" rx="6"/>
  <text class="t" x="425" y="176" text-anchor="middle">AI 2: bear_detector</text>
  <text class="s" x="425" y="195" text-anchor="middle">YOLOv8 detects bears</text>
  <text class="s" x="425" y="210" text-anchor="middle">LiDAR range → map position</text>
  <rect class="box" x="60" y="150" width="210" height="70" rx="6"/>
  <text class="t" x="165" y="176" text-anchor="middle">Results display and log</text>
  <text class="s" x="165" y="195" text-anchor="middle">terminal table, RViz markers</text>
  <text class="s" x="165" y="210" text-anchor="middle">JSON / CSV, video (MP4)</text>
  <!-- edges -->
  <path class="e" d="M170,49 H206"/>
  <path class="e" d="M360,49 H396"/><text class="l" x="378" y="42" text-anchor="middle">/risk_scores</text>
  <path class="e" d="M570,42 H606"/><text class="l" x="588" y="35" text-anchor="middle">Goal</text>
  <path class="e" d="M606,58 H574"/><text class="l" x="590" y="72" text-anchor="middle">Cancel</text>
  <path class="e" d="M680,78 V146"/><text class="l" x="686" y="115">/cmd_vel</text>
  <path class="e" d="M580,185 H524"/><text class="l" x="552" y="178" text-anchor="middle">image, /scan</text>
  <path class="e" d="M425,150 L470,82"/><text class="l" x="455" y="118">BearDetection</text>
  <path class="e" d="M430,78 L260,148"/><text class="l" x="300" y="112">patrol results</text>
</svg>